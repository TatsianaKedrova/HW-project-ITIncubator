name: Deploy Static Content to Pages

on:
  push:
    branches: ['master'] 

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🌟 1. Install pnpm on the GitHub cloud computer
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 🌟 2. Set up Node and tell it to use pnpm cache
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm' 

      # 🌟 3. Use the pnpm install command instead of npm ci
      - name: Install dependencies
        run: pnpm install --frozen-lockfile 

      # 🌟 4. Run your build using pnpm
      - name: Build
        run: pnpm run build 

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
